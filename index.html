<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div id="lock" class="lock" hidden></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="./icons/icon-192.png" alt=""><div><h1>فلوسي</h1></div></div>
    <div class="toolbar" style="flex:0 0 auto"><span class="status" id="netStatus" hidden>دون اتصال</span><span class="status" id="saveStatus" role="status">جارٍ التحميل…</span></div>
  </header>
  <div id="banners"></div>
  <main>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-history"></section>
    <section class="view" id="v-accounts"></section>
    <section class="view" id="v-clients"></section>
    <section class="view" id="v-debts"></section>
    <section class="view" id="v-goals"></section>
    <section class="view" id="v-recurring"></section>
    <section class="view" id="v-reports"></section>
    <section class="view" id="v-more"></section>
    <section class="view" id="v-settings"></section>
    <section class="view" id="v-detail"></section>
  </main>
  <nav class="bottom-nav" aria-label="التنقل الرئيسي"><div class="in">
    <button class="nav-btn" data-nav="home"><svg class="i"><use href="#i-home"/></svg>الرئيسية</button>
    <button class="nav-btn" data-nav="history"><svg class="i"><use href="#i-list"/></svg>العمليات</button>
    <button class="nav-add" data-action="quick-add" aria-label="إضافة عملية"><svg class="i" style="width:28px;height:28px"><use href="#i-plus"/></svg></button>
    <button class="nav-btn" data-nav="reports"><svg class="i"><use href="#i-chart"/></svg>التقارير</button>
    <button class="nav-btn" data-nav="more"><svg class="i"><use href="#i-grid"/></svg>المزيد</button>
  </div></nav>
</div>

<noscript><p style="padding:20px">يحتاج فلوسي إلى تفعيل JavaScript.</p></noscript>
